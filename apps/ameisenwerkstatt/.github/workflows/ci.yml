# Same gate as local `bash scripts/ci.sh` (lint, typecheck, test, build).
# Until Origin required checks exist, that local run is the quality gate.
# This workflow does not execute on Origin until Depot or Buildkite is connected.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: bash scripts/ci.sh
